[project]
name = "kong-labkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "jinja2>=3.1", "pyyaml>=6.0", "click>=8.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "docker: docker コマンドを必要とするテスト",
    "slow: コンテナを起動するテスト",
]
