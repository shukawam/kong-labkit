[tasks.up]
description = "環境を起動する"
run = "docker compose up -d"

[tasks.down]
description = "環境を停止する"
run = "docker compose down"

[tasks.reset]
description = "ボリュームごと作り直す"
run = """
docker compose down -v
docker compose up -d
"""

[tasks.certs]
description = "クラスタ証明書を再生成する"
run = '''
mkdir -p .certs
openssl req -new -x509 -nodes -newkey rsa:2048 \
  -subj "/CN=acme-ai-gateway/C=JP" \
  -addext "subjectAltName=DNS:acme-ai-gateway" \
  -keyout .certs/cluster.key -out .certs/cluster.crt -days 1095
chmod 600 .certs/cluster.key
echo "生成しました。mise run sync で .certs/cluster.crt を Konnect に登録し、mise run up で環境を起動してください。起動済みの場合は docker compose restart で証明書を読み直してください。"
'''

[tasks.setup]
description = "証明書の用意から環境の起動までを通しで行う"
run = '''
set -euo pipefail
: "${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env}"


if [ ! -f .certs/cluster.crt ]; then
  mise run certs
fi

DECK_AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" kongctl sync konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --auto-approve

# --columns はヘッダ 1 行と値 1 行を返すので、jq を足さずに最終行だけ取る
endpoint=$(kongctl get konnect gateway control-planes acme-ai-gateway --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --columns 'EP=.config.control_plane_endpoint' | tail -n 1)
cp_id=${endpoint#https://}
cp_id=${cp_id%%.*}
if [ -z "$cp_id" ]; then
  echo "acme-ai-gateway のエンドポイントを取得できませんでした。mise run sync が成功しているか確認してください。" >&2
  exit 1
fi

# .env には API キーも入っている。想定外の形なら追記せずに止める
if ! grep -q '^CONTROL_PLANE_ID=' .env; then
  echo ".env に CONTROL_PLANE_ID の行がありません。CONTROL_PLANE_ID=\"$cp_id\" を手で追記してください。" >&2
  exit 1
fi
tmp=$(mktemp ./.env.XXXXXX)
trap 'rm -f "$tmp"' EXIT
sed 's|^CONTROL_PLANE_ID=.*|CONTROL_PLANE_ID="'"$cp_id"'"|' .env > "$tmp"
mv "$tmp" .env
trap - EXIT
echo "CONTROL_PLANE_ID=$cp_id を .env に反映しました。"

docker compose up -d

echo "起動しました。mise run smoke で疎通を確認してください。"
'''

[tasks.sync]
description = "宣言的設定を適用する"
run = '''
set -euo pipefail
: "${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env}"

DECK_AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" kongctl sync konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --auto-approve
'''

[tasks.diff]
description = "宣言的設定の差分を見る"
run = '''
set -euo pipefail
: "${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env}"

DECK_AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" kongctl diff konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT"
'''

[tasks.logs]
description = "ログを追う。サービス名を引数で渡せる"
run = 'docker compose logs -f {{arg(name="service", default="")}}'

[tasks.smoke]
description = "主要経路を叩いて疎通を確認する"
run = '''
set -e
code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"ping"}]}')
test "$code" = "401"
# 認証に加え、AI Proxy と上流の疎通も検証する。502 を成功扱いしない
code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -H 'Authorization: ldap ZGV2ZWxvcGVyOmRldmVsb3Blci1wYXNzd29yZA==' -X POST http://localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"ping"}]}')
if [ "$code" != "200" ]; then
  echo "smoke: authenticated chat request returned HTTP $code (expected 200)" >&2
  exit 1
fi
echo "smoke: OK"
'''

[env]
mise.file = ".env"
