_format_version: "3.0"

services:
  - name: llm
    # ai-proxy-advanced が上流を差し替えるが、service には URL が必須なので捨て値を置く
    url: http://localhost:32000
    routes:
      - name: chat
        paths:
          - /v1/chat/completions
        methods:
          - POST
        strip_path: false
        # 省略すると平文 HTTP が 426 で弾かれる（decK/Kong のルート protocols 既定値は https のみ）
        protocols:
          - http
          - https
    plugins:
      - name: ai-proxy-advanced
        config:
          targets:
            - route_type: llm/v1/chat
              # 既定は false。false のままだと gen_ai.* / kong.gen_ai.* メトリクスが一切出ない
              logging:
                log_statistics: true
                log_payloads: false
              auth:
                header_name: api-key
                header_value: '${{ env "DECK_AZURE_OPENAI_API_KEY" }}'
              model:
                provider: azure
                name: gpt-5-6
                options:
                  azure_instance: acme-foundry
                  azure_deployment_id: gpt-5.6
                  azure_api_version: "2024-12-01-preview"
      - name: ldap-auth-advanced
        config:
          ldap_host: lldap
          ldap_port: 3890
          # 検索してから bind するので、ユーザーの DN を組み立てる必要がない
          bind_dn: cn=admin,ou=people,dc=acme,dc=local
          ldap_password: 'local-dev-password'
          base_dn: ou=people,dc=acme,dc=local
          attribute: uid
          header_type: ldap
          # lldap は平文 LDAP のみを listen する
          ldaps: false
          start_tls: false
          verify_ldap_host: false
          cache_ttl: 60
          # true にすると Consumer の解決自体がスキップされ、リクエストが Consumer に紐付かない。
          # 紐付かないと kong.auth.consumer.name 属性が出ず、Consumer 単位のダッシュボードが空になる。
          # 代償として、LDAP には居るが consumers に無いユーザーは 403 になる
          consumer_optional: false
          consumer_by:
            - username
          group_base_dn: ou=groups,dc=acme,dc=local
          group_name_attribute: cn
          group_member_attribute: member

# ldap-auth-advanced の consumer_by が突き合わせる先。LDAP の認証成功だけでは Consumer は生えない
consumers:
  - username: developer
  - username: researcher

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      logs_endpoint: http://otel-lgtm:4318/v1/logs
      # Grafana のダッシュボードはここから出る OTLP メトリクスだけを見ている。
      # Prometheus プラグインは使わない
      metrics:
        endpoint: http://otel-lgtm:4318/v1/metrics
        push_interval: 15
        enable_request_metrics: true
        enable_latency_metrics: true
        enable_bandwidth_metrics: true
        enable_upstream_health_metrics: true
        enable_consumer_attribute: true
        enable_ai_metrics: true
      resource_attributes:
        service.name: acme-ai-gateway
