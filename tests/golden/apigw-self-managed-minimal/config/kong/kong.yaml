_format_version: "3.0"

services:
  - name: httpbin
    url: http://httpbin:80
    routes:
      - name: httpbin
        paths:
          - /httpbin
        strip_path: true
        # 省略すると平文 HTTP が 426 で弾かれる（decK/Kong のルート protocols 既定値は https のみ）
        protocols:
          - http
          - https

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      logs_endpoint: http://otel-lgtm:4318/v1/logs
      resource_attributes:
        service.name: acme-gateway
