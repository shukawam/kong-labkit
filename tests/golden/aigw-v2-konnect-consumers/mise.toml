[tasks.up]
description = "環境を起動する"
run = '''
set -euo pipefail
docker compose up -d
'''

[tasks.down]
description = "環境を停止する"
run = "docker compose down"

[tasks.reset]
description = "ボリュームごと作り直す"
run = """
docker compose down -v
docker compose up -d
"""

[tasks.certs]
description = "クラスタ証明書を再生成する"
run = '''
mkdir -p .certs
openssl req -new -x509 -nodes -newkey rsa:2048 \
  -subj "/CN=acme-ai-gateway/C=JP" \
  -addext "subjectAltName=DNS:acme-ai-gateway" \
  -keyout .certs/cluster.key -out .certs/cluster.crt -days 1095
chmod 600 .certs/cluster.key
echo "生成しました。mise run sync で .certs/cluster.crt を Konnect に登録し、mise run up で環境を起動してください。起動済みの場合は docker compose restart で証明書を読み直してください。"
'''

[tasks.setup]
description = "証明書の用意から環境の起動までを通しで行う"
run = '''
set -euo pipefail



if [ ! -f .certs/cluster.crt ]; then
  mise run certs
fi

mise run keys
# mise は .env をタスク開始時に読むので、いま埋めたキーを kongctl に渡すには読み直す
set -a
. ./.env
set +a

kongctl sync konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --auto-approve --write-secrets
# --columns はヘッダ 1 行と値 1 行を返すので、jq を足さずに最終行だけ取る
endpoint=$(kongctl get konnect ai-gateway acme-ai-gateway --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --columns 'EP=.endpoints.configuration' | tail -n 1)
cp_id=${endpoint#https://}
cp_id=${cp_id%%.*}
if [ -z "$cp_id" ]; then
  echo "acme-ai-gateway のエンドポイントを取得できませんでした。mise run sync が成功しているか確認してください。" >&2
  exit 1
fi

# .env には API キーも入っている。想定外の形なら追記せずに止める
if ! grep -q '^CONTROL_PLANE_ID=' .env; then
  echo ".env に CONTROL_PLANE_ID の行がありません。CONTROL_PLANE_ID=\"$cp_id\" を手で追記してください。" >&2
  exit 1
fi
tmp=$(mktemp ./.env.XXXXXX)
trap 'rm -f "$tmp"' EXIT
sed 's|^CONTROL_PLANE_ID=.*|CONTROL_PLANE_ID="'"$cp_id"'"|' .env > "$tmp"
mv "$tmp" .env
trap - EXIT
echo "CONTROL_PLANE_ID=$cp_id を .env に反映しました。"

docker compose up -d

echo "起動しました。mise run smoke で疎通を確認してください。"
'''

[tasks.sync]
description = "宣言的設定を適用する"
run = '''
set -euo pipefail

: "${AI_CONSUMER_KEY_ALICE:?Run mise run keys to fill AI_CONSUMER_KEY_ALICE in .env}"
: "${AI_CONSUMER_KEY_BOB:?Run mise run keys to fill AI_CONSUMER_KEY_BOB in .env}"
: "${AI_CONSUMER_KEY_BOB_TEMPORARY:?Run mise run keys to fill AI_CONSUMER_KEY_BOB_TEMPORARY in .env}"

# kongctl は書き込み専用の秘密を比較しないので、.env だけ変えても --write-secrets 無しでは更新が走らない。
# しかも --write-secrets 無しの更新は azure の headers[].value を消す（1.20.2 で実測）ので常に付ける
kongctl sync konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --auto-approve --write-secrets'''

[tasks.diff]
description = "宣言的設定の差分を見る"
run = '''
set -euo pipefail

: "${AI_CONSUMER_KEY_ALICE:?Run mise run keys to fill AI_CONSUMER_KEY_ALICE in .env}"
: "${AI_CONSUMER_KEY_BOB:?Run mise run keys to fill AI_CONSUMER_KEY_BOB in .env}"
: "${AI_CONSUMER_KEY_BOB_TEMPORARY:?Run mise run keys to fill AI_CONSUMER_KEY_BOB_TEMPORARY in .env}"

kongctl diff konnect -f config/kongctl.yaml --base-dir . --base-url https://us.api.konghq.com --pat "$KONNECT_PAT" --write-secrets'''

[tasks.keys]
description = "AI Consumer の API キーのうち、.env で空のものを乱数で埋める"
run = '''
set -euo pipefail
# 値が入っているキーは触らない。setup をやり直しても配布済みのキーが変わらないようにする
tmp=$(mktemp ./.env.XXXXXX)
trap 'rm -f "$tmp" "$tmp.next"' EXIT
cp .env "$tmp"
filled=0
for name in AI_CONSUMER_KEY_ALICE AI_CONSUMER_KEY_BOB AI_CONSUMER_KEY_BOB_TEMPORARY; do
  if grep -q "^${name}=\"\"\$" "$tmp"; then
    value=$(openssl rand -hex 24)
    sed "s|^${name}=\"\"\$|${name}=\"${value}\"|" "$tmp" > "$tmp.next"
    mv "$tmp.next" "$tmp"
    filled=$((filled + 1))
  elif ! grep -q "^${name}=" "$tmp"; then
    echo ".env に ${name} の行がありません。${name}=\"\" を追記してから再実行してください。" >&2
    exit 1
  fi
done
chmod 600 "$tmp"
mv "$tmp" .env
trap - EXIT
echo "API キーを ${filled} 個生成しました。値は .env にあります。"
'''

[tasks.logs]
description = "ログを追う。サービス名を引数で渡せる"
run = 'docker compose logs -f {{arg(name="service", default="")}}'

[tasks.smoke]
description = "主要経路を叩いて疎通を確認する"
run = '''
set -e
curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:8100/status
code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/v1/gpt-5-6/chat/completions \
  -H 'Content-Type: application/json' -d '{}')
if [ "$code" != "401" ]; then
  echo "smoke: request without an API key returned HTTP $code (expected 401)" >&2
  exit 1
fi
# model は省けない。無いと AI Gateway が target を選べず ai-gateway.upstream.local の DNS 解決で 500 になる
curl -sS -f -X POST http://localhost:8000/v1/gpt-5-6/chat/completions \
  -H "apikey: $AI_CONSUMER_KEY_ALICE" -H 'Content-Type: application/json' \
  -d '{"model":"gpt-5-6","messages":[{"role":"user","content":"ping"}]}' > /dev/null
echo "smoke: OK"
'''

[env]
_.file = ".env"
