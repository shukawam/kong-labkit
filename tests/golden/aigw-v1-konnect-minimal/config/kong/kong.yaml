_format_version: "3.0"

services:
  - name: llm
    # ai-proxy-advanced が上流を差し替えるが、service には URL が必須なので捨て値を置く
    url: http://localhost:32000
    routes:
      - name: chat
        paths:
          - /v1/chat/completions
        methods:
          - POST
        strip_path: false
        # 省略すると平文 HTTP が 426 で弾かれる（decK/Kong のルート protocols 既定値は https のみ）
        protocols:
          - http
          - https
    plugins:
      - name: ai-proxy-advanced
        config:
          targets:
            - route_type: llm/v1/chat
              # 既定は false。false のままだと gen_ai.* / kong.gen_ai.* メトリクスが一切出ない
              logging:
                log_statistics: true
                log_payloads: false
              auth:
                header_name: api-key
                header_value: '${{ env "DECK_AZURE_OPENAI_API_KEY" }}'
              model:
                provider: azure
                name: gpt-5-6
                options:
                  azure_instance: acme-foundry
                  azure_deployment_id: gpt-5.6
                  azure_api_version: "2024-12-01-preview"

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      logs_endpoint: http://otel-lgtm:4318/v1/logs
      # Grafana のダッシュボードはここから出る OTLP メトリクスだけを見ている。
      # Prometheus プラグインは使わない
      metrics:
        endpoint: http://otel-lgtm:4318/v1/metrics
        push_interval: 15
        enable_request_metrics: true
        enable_latency_metrics: true
        enable_bandwidth_metrics: true
        enable_upstream_health_metrics: true
        enable_consumer_attribute: true
        enable_ai_metrics: true
      resource_attributes:
        service.name: acme-ai-gateway
