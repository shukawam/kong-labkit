# yaml-language-server: $schema=../schemas/env.schema.json
customer: acme
gateway: ai-gateway-v2
control_plane: konnect

ai:
  providers:
    - type: azure
      service: azure-foundry
      instance: acme-foundry
      auth: api-key
      models:
        - name: gpt-5-6
          model_id: gpt-5.6
  consumer_groups:
    - name: sales
      rate_limit:
        tokens: 10000
        window: 60
    - name: engineering
  consumers:
    - name: alice
      groups: [sales]
      keys:
        - name: alice
    - name: bob
      groups: [engineering]
      keys:
        - name: bob
        - name: bob-temporary
          ttl: 3600

idp:
  type: none

cache:
  type: none

vectordb:
  type: none
