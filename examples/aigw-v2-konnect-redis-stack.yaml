# yaml-language-server: $schema=../schemas/env.schema.json
customer: acme
gateway: ai-gateway-v2
control_plane: konnect
region: us

ai:
  providers:
    - type: azure
      # Foundry の v1 API（/openai/v1）。deployment パスと日付付き api_version を使わない
      service: azure-foundry
      instance: acme-foundry
      auth: api-key
      models:
        - name: gpt-5-6
          model_id: gpt-5.6
  semantic_cache: true

cache:
  type: redis-stack

vectordb:
  type: redis-stack
